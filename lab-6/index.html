<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank DApp · Assignment Lab 6</title>
  <link rel="stylesheet" href="../bank-ui.css">
</head>
<body>
  <header class="topbar">
    <div class="container header-inner">
      <a class="brand" href="../" aria-label="Bank DApp · หน้าหลัก">
        <span class="mark" aria-hidden="true">B</span>
        <span>Bank DApp</span>
      </a>
      <nav class="lab-nav" aria-label="เลือกงาน">
        <a href="../lab-6/" aria-current="page">Lab 6</a>
        <a href="../lab-7/">Lab 7</a>
      </nav>
      <button id="connect" class="button connect" type="button">เชื่อม MetaMask</button>
    </div>
  </header>

  <main class="container">
    <div class="page-intro">
      <div>
        <p class="lab-label">Lab 6 <span aria-hidden="true">/</span> MetaMask</p>
        <h1>บัญชีธนาคาร Web3</h1>
      </div>
      <p class="identity"><strong id="student-name"></strong><span id="student-id"></span></p>
    </div>

    <div class="dashboard">
      <section class="balance-panel" aria-labelledby="balance-title">
        <div class="balance-heading">
          <h2 id="balance-title">ยอดเงินในสัญญา</h2>
          <span id="network" class="network"></span>
        </div>
        <p class="balance"><output id="balance" aria-live="polite">—</output> <span>ETH</span></p>
        <button id="check" class="button check" type="button" disabled><span aria-hidden="true">↻</span> เช็กยอด</button>

        <dl class="details">
          <dt>กระเป๋าที่เชื่อมต่อ</dt><dd id="wallet">ยังไม่เชื่อมต่อ</dd>
          <dt>Smart Contract</dt><dd id="contract">ยังไม่ได้ตั้งค่า</dd>
        </dl>
      </section>

      <section class="transaction-panel" aria-labelledby="transaction-title">
        <h2 id="transaction-title">ฝากและถอน</h2>
        <label for="amount">จำนวนเงิน</label>
        <div class="amount-field">
          <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" disabled>
          <span>ETH</span>
        </div>
        <div class="actions">
          <button id="deposit" class="button primary" type="button" disabled>ฝากเงิน</button>
          <button id="withdraw" class="button secondary" type="button" disabled>ถอนเงิน</button>
        </div>
        <div class="transaction-feedback">
          <p id="status" role="status" aria-live="polite"></p>
          <a id="transaction-link" target="_blank" rel="noopener noreferrer" hidden>ดูธุรกรรมใน Explorer ↗</a>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
